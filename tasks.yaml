      - Dropdown selector: "Inverse Scramble" vs "CFOP (Cross, F2L, OLL, PLL)"
      - Solutions consistently < 40 moves (typically ≤ scramble length)
      - 13 unit tests covering all scenarios (81/81 tests pass)
