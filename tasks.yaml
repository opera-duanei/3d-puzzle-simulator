      - Modified rotateLayer() to accept and animate multiple layers in single pivot
      - Renamed getPiecesInLayer() to getPiecesInLayers() for clarity
      - Browser verified: u, u2, Rw, Rw2 all animate both layers together ✓
      - All tests pass (107/107), linting passes
      - Files modified: src/lib/move-handler.ts:3-200, src/lib/components/RubiksCube.svelte:56-68,222

