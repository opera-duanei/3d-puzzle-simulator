  - title: Fix colors
    status: Accepted
    description: |
      - Drop the transparency on the cube colors
      - Some side have a big black square in the middle. This is wrong and needs to be fixed.

      COMPLETED: Fixed transparency and black square rendering issues
      - Removed transparency (opacity: 0.7) from all cube face materials
      - Changed internal face color from pure black to match background
      - All exterior faces now render with solid, vibrant colors
      - Internal faces blend seamlessly with background
      - Browser verified: no visible black squares, colors are solid

      REJECTED 2026-01-13: Black squares still visible in browser
      - Screenshot shows black/dark squares in middle of yellow top face
      - Black squares also visible on orange side faces
      - Transparency fix works ✓ but black square fix failed ✗

      FIXED 2026-01-13: Added THREE.FrontSide to prevent back faces rendering
      - Applied `side: THREE.FrontSide` to all piece materials
      - Prevents thin center piece (0.2 thickness) back faces from showing
      - Browser verified: all center pieces show solid colors, no black squares ✓
      - All lints + tests pass (68/68)

  - title: Fix light source
    status: Accepted
    description: |
      Something seems to be wrong with then light source.
      It looks like the camera is moving, because one side of the cube is darker than the other.
      When we rotate the cube, we want the cube to rotate, not the camera. We want the light to have a consistent direction, independently of the cube rotation.

      COMPLETED: Fixed lighting to maintain consistent direction
      - Attached DirectionalLight to camera instead of scene
      - Added camera to scene (required for child lights to work)
      - Light now moves with viewer, maintaining consistent illumination
      - Browser verified: all cube faces evenly lit during rotation

